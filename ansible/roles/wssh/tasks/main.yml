---
- name: Install wssh deb packages
  apt:
    name:
      - nginx
      - systemd
      - python3-pip
      - python3-venv
      - python3-cryptography
      - python3-bcrypt

- name: Install wssh pip packages
  pip:
    name:
      - webssh
    virtualenv: "/usr/local/venv/{{ project_name}}"
    # virtualenv_site_packages: True
    virtualenv_command: "python3 -m venv --system-site-packages"

- name: systemd files
  ansible.builtin.template:
    src: "templates/etc/systemd/system/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
  with_items:
    - wssh.socket
    - wssh.service
  notify:
   - reload systemd
  tags:
    - wssh

- name: Enable services
  systemd:
    service: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  with_items:
    - wssh.socket
    - wssh.service
  tags:
    - wssh

- name: Create etc/nginx/includes dir
  ansible.builtin.file:
    path: /etc/nginx/includes
    state: directory

- name: Deploy nginx conf
  template:
    src: "files/etc/nginx/includes/wssh.conf"
    dest: "/etc/nginx/includes/{{ conference_name }}-wssh.conf"
  tags:
    - pibsite
    - wssh
  notify:
    - reload nginx

