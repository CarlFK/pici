---
- name: don't helper resize the root fs
  command: chroot "{{ nfs_root }}/root" dpkg-divert --divert "{{ item }}.diverted" --rename "{{ item }}"
  with_items:
    - "/var/lib/systemd/deb-systemd-helper-enabled/rpi-resize.service.dsh-also"
    - "/usr/lib/systemd/zram-generator.conf.d/20-rpi-swap-zram0-ctrl.conf"
    - "/usr/lib/systemd/system-generators/rpi-swap-generator"
  tags:
    - nogrow

- name: don't resize the root fs
  command: systemctl --root "{{ nfs_root }}/root" mask "{{ item }}"
  with_items:
    - "systemd-growfs@.service"
    - "systemd-growfs-root.service"
    - "rpi-remove-swap-file@.service"
    - "rpi-resize-swap-file.service"
    - "swap.target"
    - "rpi-resize.service"
    - "systemd-networkd-persistent-storage.service"
  tags:
    - nogrow

#     ./usr/lib/systemd/system/systemd-networkd-persistent-storage.service
- name: don't manage a swap file
  file:
    path: "{{ nfs_root }}/root/{{ item }}"
    state: absent
  with_items:
    - "etc/systemd/system/multi-user.target.wants/dphys-swapfile.service"
    - "etc/systemd/system/dphys-swapfile.service"
  tags:
    - nogrow

- name: don't resize the root fs
  file:
    path: "{{ nfs_root }}/root/etc/init.d/resize2fs_once"
    state: absent

# The Pis boot with root on NFS (ip=dhcp) under overlayroot=tmpfs.
# If systemd-networkd runs, it takes over the NIC that carries the NFS root:
# systemd-network-generator turns ip=dhcp into
# /run/systemd/network/71-default.network, and because / is an overlay (not
# NFS) networkd's KeepConfiguration= defaults to "no", so the address the
# kernel configured stops working ~18 s into boot.  The root fs vanishes,
# PID 1 hangs, and the hardware watchdog resets the Pi about a minute later,
# forever.  NetworkManager already looks after the interface, so networkd is
# not needed.
# mask (not disable): a first boot with no machine-id runs "preset-all", and
# the upstream systemd preset enables networkd again.
- name: don't let systemd-networkd take over the NFS root NIC
  command: systemctl --root "{{ nfs_root }}/root" mask "{{ item }}"
  with_items:
    - "systemd-networkd.service"
    - "systemd-networkd.socket"
    - "systemd-network-generator.service"
    - "systemd-networkd-wait-online.service"
  tags:
    - nogrow
    - fixpi

