# Tell systemd-networkd that / is on the network (pici: fixpi).
#
# The Pis boot with their root on NFS under overlayroot=tmpfs, so / is an overlay mount.
# systemd-networkd keeps the address the kernel took for the NFS root (ip=dhcp) only when
# / is a network filesystem, and it does not look through an overlay to the NFS below.
# Without this it reconfigures the interface, the NFS root stops answering, and the Pi
# hangs until its watchdog resets it, about every 100 s.
#
# systemd's answer (https://github.com/systemd/systemd/issues/44156): mark the mount
# _netdev. overlayroot has no setting for mount options, and the initramfs mounts with
# busybox, which writes no /run/mount/utab. So this adds libmount's utab line for /
# just before networkd starts, and only when / is overlayroot's overlay. The line has
# no ID= on purpose: mount IDs differ inside networkd's own mount namespace.
[Service]
ExecStartPre=+/bin/sh -c 'L="SRC=overlayroot TARGET=/ ROOT=/ OPTS=_netdev"; [ "$$(findmnt -n -o SOURCE /)" = overlayroot ] || exit 0; mkdir -p /run/mount; grep -qxF "$$L" /run/mount/utab || echo "$$L" >> /run/mount/utab'
