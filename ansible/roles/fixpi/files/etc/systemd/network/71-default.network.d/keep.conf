# Drop-in for /run/systemd/network/71-default.network, the file that
# systemd-network-generator writes from ip=dhcp on the kernel command line.
#
# The Pis boot with root on NFS under overlayroot=tmpfs.  Because / is an
# overlay (not NFS), systemd-networkd's KeepConfiguration= defaults to "no":
# when networkd starts (~18 s into boot) the address the kernel configured on
# the NIC that carries the NFS root stops working.  The root fs vanishes,
# PID 1 hangs, and the hardware watchdog resets the Pi about a minute later,
# forever.
#
# "yes" makes networkd keep the kernel's address and routes.
# See systemd.network(5), KeepConfiguration=.
[Network]
KeepConfiguration=yes
